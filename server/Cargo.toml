[package]
name = "x2d-server"
description = "Watches a Bambu Lab printer on the LAN and shows it, live, to the people invited."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "x2d"
path = "src/main.rs"

[dependencies]
x2d-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
form_urlencoded = "1"
getrandom = "0.4"
hmac = "0.13"
md-5 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = "0.23"
webpki = { package = "rustls-webpki", version = "0.103" }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util", "signal", "process"] }
tokio-rustls = { version = "0.26", default-features = false }
toml = "1"
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.18"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
