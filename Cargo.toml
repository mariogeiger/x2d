[workspace]
members = ["protocol", "server", "client"]
# The client is a browser page: trunk builds it for wasm32. Plain cargo
# commands build and test what runs natively.
default-members = ["protocol", "server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/mariogeiger/x2d"

[workspace.dependencies]
x2d-protocol = { path = "protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

# The page is downloaded: it is made small rather than fast.
[profile.release.package.x2d-client]
opt-level = "z"
