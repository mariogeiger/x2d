[package]
name = "x2d-client"
description = "The x2d page: the printer live, its camera decoded with WebCodecs, and its controls for operators."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
x2d-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "BinaryType",
  "CanvasRenderingContext2d",
  "CloseEvent",
  "CodecState",
  "console",
  "Document",
  "EncodedVideoChunk",
  "EncodedVideoChunkInit",
  "EncodedVideoChunkType",
  "HtmlCanvasElement",
  "Location",
  "MessageEvent",
  "Request",
  "RequestInit",
  "Response",
  "VideoDecoder",
  "VideoDecoderConfig",
  "VideoDecoderInit",
  "VideoFrame",
  "WebSocket",
  "Window",
] }
